version = 1
name = "Feedfold"

[setup]
script = '''
npm ci --ignore-scripts=false --cache .npm-cache
node .codex/scripts/dev-server.mjs start
'''

[setup.darwin]
script = '''
fnm exec --using=.node-version npm ci --ignore-scripts=false --cache .npm-cache
fnm exec --using=.node-version node .codex/scripts/dev-server.mjs start
'''

[cleanup]
script = "node .codex/scripts/dev-server.mjs stop"

